[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/fd/1
logfile_maxbytes=0
# Run supervisord as root, but specify user for child processes if needed
user=root

[program:x11]
priority=0
# Start TigerVNC server on display :0, listening only on localhost, port 5900
command=/usr/bin/Xtigervnc -desktop "Windsurf IDE" -localhost -rfbport 5900 -SecurityTypes None -AlwaysShared -AcceptKeyEvents -AcceptPointerEvents -AcceptSetDesktopSize -SendCutText -AcceptCutText :0
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
priority=0
# Start websockify to proxy WebSocket connections to the VNC server
# Listen on port 8080, forward to localhost:5900 (TigerVNC)
# Serve the noVNC web client files from /usr/share/novnc
command=/usr/local/bin/websockify --web /usr/share/novnc 8080 localhost:5900
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
priority=1
# Start OpenBox window manager on display :0
command=/usr/bin/openbox
environment=DISPLAY=:0
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:windsurf]
priority=1
# Start Windsurf IDE on display :0
# Add --no-sandbox and --user-data-dir arguments as required when running as root
# Pass the dummy project directory path to try and keep the IDE open
command=/usr/bin/windsurf --no-sandbox --user-data-dir=/tmp/windsurf-data /home/ubuntu/project
environment=DISPLAY=:0
# Set autorestart to false, as it seems Windsurf is not meant to run persistently this way
autorestart=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
